<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="考點筆記">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>考點筆記</title>
<style>
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --ink:#18202B; --ink2:#535D6B; --ink3:#7F8998; --line:#D3D9E1; --soft:#F5F7F9;
  --pen:#C4342C; --pen-bg:#FBECEA; --amber:#9A6200; --amber-bg:#FBF0DA; --ok:#1C7550; --ok-bg:#E2F2EA; --focus:#2D6CB5;
  --s-ds:#2D6CB5; --s-algo:#6B4BB5; --s-co:#2B8558; --s-os:#B26C0B; --s-dm:#AD3F78; --s-la:#13809A;
  --nav-h:62px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151C; --paper:#19202A; --ink:#E5E9EF; --ink2:#A3ADBB; --ink3:#748093; --line:#2B3542; --soft:#151B23;
    --pen:#FF7468; --pen-bg:#3A1F1E; --amber:#E7A83E; --amber-bg:#372A13; --ok:#55C796; --ok-bg:#15301F; --focus:#72AAE9;
    --s-ds:#64A0E4; --s-algo:#A68AE6; --s-co:#55BE8A; --s-os:#E6A140; --s-dm:#E079AE; --s-la:#45B8CC;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
main{max-width:640px;margin:0 auto;padding:8px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)}
a{color:var(--focus)}
h1{font-size:27px;line-height:1.25;margin:12px 0 10px;font-weight:700;letter-spacing:.01em}
h2{font-size:17px;line-height:1.35;margin:26px 0 10px;font-weight:650}
p{margin:6px 0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.lede{color:var(--ink2);font-size:15px}
.empty{color:var(--ink2);padding:18px 0}
.center{text-align:center}
.hint{font-size:14px;color:var(--ink2);min-height:0}
.hint.err{color:var(--pen)}
.label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 6px}
.row{display:flex;gap:8px;align-items:center;margin:10px 0}
.row.wrap{flex-wrap:wrap}
.row > input{flex:1}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.crumb{font-size:14px;color:var(--ink2);margin-top:10px}
.crumb a{text-decoration:none}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-head h2{margin-bottom:10px}

/* controls */
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:15px;line-height:1.3;padding:10px 14px;border-radius:10px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.big{width:100%;min-height:52px;font-size:17px;margin-top:10px}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--focus);padding-left:6px;padding-right:6px}
.btn.danger{color:var(--pen)}
.btn:disabled{opacity:.4;cursor:default}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;margin:0}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.search input{font-size:17px;padding:13px 14px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;margin:6px 0 14px}
.seg > *{flex:1;text-align:center;padding:8px 6px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:15px;border:0;background:none;font:inherit;cursor:pointer}
.seg > .on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* status */
.badge{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;line-height:1.5}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.unsure{background:var(--amber-bg);color:var(--amber)}
.badge.wrong{background:var(--pen-bg);color:var(--pen)}
.t-wrong{color:var(--pen);font-weight:600}
.t-unsure{color:var(--amber);font-weight:600}
.status-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.st{appearance:none;font:inherit;font-size:17px;font-weight:600;min-height:54px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.st.ok.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.st.unsure.on{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.st.wrong.on{background:var(--pen-bg);border-color:var(--pen);color:var(--pen)}

/* the red pen: error reasons */
.reason{border-left:3px solid var(--pen);padding:2px 0 2px 11px;margin:6px 0;color:var(--pen);font-weight:500;white-space:pre-wrap}
#af-reason{border-color:var(--pen);border-left-width:3px}

/* subject index tabs */
.idx{display:flex;flex-direction:column;gap:8px}
.idx a{display:flex;align-items:stretch;background:var(--paper);border:1px solid var(--line);border-radius:4px 12px 12px 4px;overflow:hidden;text-decoration:none;color:var(--ink);min-height:62px}
.idx .tab{width:34px;flex:none;background:var(--sc);color:var(--paper);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-orientation:upright;font-weight:700;font-size:14px;letter-spacing:.12em}
.idx .idx-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 14px}
.idx .idx-name{font-weight:650;font-size:16px}
.idx .idx-meta{font-size:13px;color:var(--ink2)}

/* lists */
.list{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--sc,var(--line));border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--ink);width:100%;font:inherit;text-align:left;cursor:pointer}
.crow-main{display:flex;flex-direction:column;min-width:0}
.crow-name{font-weight:600;font-size:16px;line-height:1.35}
.crow-path,.crow-why{font-size:13px;color:var(--ink2);line-height:1.4}
.crow-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;color:var(--ink2);flex:none;text-align:right}
.prow{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;text-decoration:none;color:var(--ink)}
.thumb{width:62px;height:62px;flex:none;border-radius:6px;object-fit:cover;background:var(--soft);border:1px solid var(--line)}
.thumb.empty{display:grid;place-items:center;color:var(--ink3);font-size:20px}
.prow-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.prow-top{display:flex;gap:8px;align-items:center}
.prow-concepts{font-size:14px;font-weight:600;line-height:1.4}
.prow-reason{font-size:14px;color:var(--pen);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}
.prow-text{font-size:14px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.45}

/* concept / problem pages */
.concept-title,.subj-title{border-left:6px solid var(--sc);padding-left:12px;margin-left:-2px}
.aliases{font-size:14px;color:var(--ink2)}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 14px 12px;margin-top:14px}
.summary h2{margin-top:12px}
.summary-body{white-space:pre-wrap;line-height:1.7}
.tchip{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--pen-bg);color:var(--pen);margin:0 6px 6px 0}
.tchip b{font-weight:700;margin-left:2px}
.pconcepts{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.cpill{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px;font-weight:600}
.cpill span{background:var(--sc);color:var(--paper);border-radius:999px;padding:1px 8px;font-size:12px}
.photos{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.photos img{width:100%;border-radius:8px;border:1px solid var(--line);background:var(--soft);min-height:80px;cursor:zoom-in}
.ptext{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap;line-height:1.7}
.attempts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.attempts li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.att-top{display:flex;gap:8px;align-items:center}
.att-types{margin-top:6px}

/* add flow */
.step{border-top:1px solid var(--line);padding-top:4px;margin-top:18px}
.step:first-of-type{border-top:0;margin-top:0}
.step h2{display:flex;align-items:center;gap:10px;margin-top:14px}
.step h2 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg-item{position:relative;aspect-ratio:3/4}
.pg-item img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pg-x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.pg-add{aspect-ratio:3/4;border:1.5px dashed var(--ink3);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink2);font-size:14px;padding:8px;cursor:pointer;position:relative;background:var(--paper)}
.pg-add input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ccard{background:var(--paper);border:1.5px solid var(--focus);border-radius:12px;padding:12px 14px;margin:10px 0}
.ccard.done{border-color:var(--line);border-left:4px solid var(--ok)}
.ccard-head{font-size:14px;color:var(--ink2)}
.ccard.done .ccard-head{color:var(--ok);font-weight:600}
.ccard-path{font-size:16px;margin:4px 0;line-height:1.5}
.ccard .row{margin-bottom:0}
.sch{display:inline-block;background:var(--sc);color:var(--paper);border-radius:4px;padding:0 6px;font-size:13px;font-weight:600;margin-right:4px;vertical-align:1px}
.missing{color:var(--pen);font-size:14px;margin-top:16px;min-height:1em}
details summary{cursor:pointer;color:var(--focus);padding:8px 0;font-size:15px}
.manual{margin-top:6px}

/* banners */
.banner{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:12px 14px;margin:12px 0}
.banner.warn{border-left-color:var(--pen)}
.banner > b{display:block;margin-bottom:2px}
.banner p{font-size:14px;color:var(--ink2)}
.steps{padding-left:22px;margin:8px 0}
.steps li{margin:4px 0}

/* review */
.sess-top{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-top:12px}
.progress{height:4px;background:var(--line);border-radius:2px;margin:8px 0 4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink)}
.reveal{border-top:1px dashed var(--line);margin-top:18px}
.tally{display:flex;gap:10px;margin:16px 0}
.tally div{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:14px;color:var(--ink2)}
.tally b{display:block;font-size:24px;color:var(--ink)}

/* stats */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3em;gap:10px;align-items:center;font-size:14px}
.bar-t{height:10px;background:var(--soft);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--pen)}
.bar-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
table.subj{width:100%;border-collapse:collapse;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.subj th,table.subj td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.subj th:first-child,table.subj td:first-child{text-align:left}
table.subj th{color:var(--ink2);font-weight:500;font-size:13px}
table.subj tr:last-child td{border-bottom:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sc);margin-right:6px;vertical-align:1px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin:12px 0}
.panel h2{margin-top:12px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
@supports (background:color-mix(in srgb,red 50%,blue)) and ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){#tabs{background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
#tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink3);text-decoration:none;padding:3px 0;max-width:110px}
#tabs a.on{color:var(--ink);font-weight:600}
#tabs svg{width:24px;height:24px}
#tabs a.add .ic{background:var(--ink);color:var(--paper);border-radius:12px;width:48px;height:30px;display:grid;place-items:center}
#tabs a.add svg{width:20px;height:20px}
body.typing #tabs{display:none}

/* sheet, toast, viewer */
#sheet-root{display:none}
#sheet-root.open{display:block}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet-x{position:sticky;top:0;float:right;margin-top:4px;appearance:none;border:0;background:var(--soft);color:var(--ink2);font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;z-index:2}
.sheet h2{margin-top:10px}
.sheet .list{max-height:40vh;overflow:auto}
.prompt-pre{white-space:pre-wrap;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:50vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#viewer{position:fixed;inset:0;background:#000;z-index:70;overflow:auto;display:none;padding-top:env(safe-area-inset-top)}
#viewer.open{display:block}
#viewer img{width:100%;display:block;touch-action:pinch-zoom}
#viewer button{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:71;appearance:none;border:0;background:rgba(255,255,255,.2);color:#fff;font:inherit;padding:8px 14px;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
'use strict';
/* ============================================================
   考點筆記 — 資工所六科錯題與考點筆記
   單一檔案、無外部相依。資料存在瀏覽器的 IndexedDB。
   結構說明見 README.md。
   ============================================================ */
const APP_VERSION = '1.0.0';

const SUBJECTS = [
  { id:'ds',   name:'資料結構',   short:'資結', aliases:['資結','ds','datastructure','datastructures'] },
  { id:'algo', name:'演算法',     short:'演算', aliases:['演算','算法','algorithm','algorithms','algo'] },
  { id:'co',   name:'計算機組織', short:'計組', aliases:['計組','計算機結構','計結','computerorganization','computerarchitecture','co'] },
  { id:'os',   name:'作業系統',   short:'OS',   aliases:['os','operatingsystem','operatingsystems','作系'] },
  { id:'dm',   name:'離散數學',   short:'離散', aliases:['離散','discretemath','discretemathematics','dm'] },
  { id:'la',   name:'線性代數',   short:'線代', aliases:['線代','linearalgebra','la'] },
];
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s.id, s]));

// 第一次開啟時建立的章節骨架（之後可以在 App 裡新增、改名）
const SEED_CHAPTERS = {
  ds:   ['複雜度分析','陣列與鏈結串列','堆疊與佇列','樹與二元樹','二元搜尋樹與平衡樹','堆積與優先佇列','B 樹與多元搜尋樹','圖的表示與走訪','排序','搜尋與雜湊','不相交集合','字串與 Trie'],
  algo: ['漸近分析與遞迴式','分治法','動態規劃','貪婪演算法','圖的走訪與拓樸排序','最短路徑','最小生成樹','網路流與匹配','攤銷分析','隨機化演算法','字串比對','NP 完備性'],

/* ---------- IndexedDB ---------- */
const DB_NAME = 'kaodian-notebook', DB_VERSION = 1;
const STORES = ['chapters','concepts','problems','photos','meta'];
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'meta' ? 'key' : 'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const req = fn(t.objectStore(store));
    let out;
    if (req) req.onsuccess = () => { out = req.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('儲存失敗，手機空間可能不足。'));
  });
}
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));
function dbPutMany(s, arr) {
  return new Promise((res, rej) => {
    const t = db.transaction(s, 'readwrite'); const st = t.objectStore(s);
    arr.forEach(v => st.put(v));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
function dbClearAll() {
  return new Promise((res, rej) => {
    const t = db.transaction(STORES, 'readwrite');
    STORES.forEach(s => t.objectStore(s).clear());
    t.oncomplete = () => res(); t.onerror = () => rej(t.error);
  });
}

const chaptersOf = sid => S.chapters.filter(c => c.subject === sid).sort((a, b) => a.order - b.order);
const conceptsOfChapter = chid => S.concepts.filter(c => c.chapterId === chid).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
const problemsOf = cid => S.problems.filter(p => p.conceptIds.includes(cid)).sort((a, b) => b.createdAt - a.createdAt);
const latest = p => p.attempts[p.attempts.length - 1];
const statusOf = p => (latest(p) || {}).status || 'ok';
const lastTouched = p => Math.max(p.createdAt, ...p.attempts.map(a => a.at));
const subjectOfConcept = c => (CH[c.chapterId] || {}).subject;
function conceptPath(c) { const ch = CH[c.chapterId] || { name:'（未分章節）', subject:'ds' }; return { ch, s: SUBJ[ch.subject] || SUBJECTS[0] }; }
function distinctSources() { return [...new Set(S.problems.map(p => p.source).filter(Boolean))].sort(); }

/* ---------- text matching ---------- */
function norm(s) { return String(s || '').normalize('NFKC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, ''); }
function grams(s) {
  const g = new Map();
  if (s.length === 1) { g.set(s, 1); return g; }
  for (let i = 0; i < s.length - 1; i++) { const k = s.slice(i, i + 2); g.set(k, (g.get(k) || 0) + 1); }
  return g;
}
function dice(a, b) {
  const A = grams(a), B = grams(b); let inter = 0, na = 0, nb = 0;
  A.forEach(v => na += v); B.forEach(v => nb += v);
  A.forEach((v, k) => { if (B.has(k)) inter += Math.min(v, B.get(k)); });
  return na + nb ? 2 * inter / (na + nb) : 0;
}
function sim(a, b) {
  a = norm(a); b = norm(b);
  if (!a || !b) return 0;
  if (a === b) return 1;
  const short = a.length <= b.length ? a : b, long = a.length <= b.length ? b : a;
  let s = dice(a, b);
  if (short.length >= 2 && long.includes(short)) s = Math.max(s, 0.6 + 0.35 * short.length / long.length);
  return s;
}
function conceptScore(q, c) { let best = sim(q, c.name); for (const a of c.aliases || []) best = Math.max(best, sim(q, a)); return best; }
function rankConcepts(q, sid) {
  return S.concepts.map(c => ({ c, score: conceptScore(q, c) + (sid && subjectOfConcept(c) === sid ? 0.05 : 0) }))
    .filter(x => x.score >= 0.3).sort((a, b) => b.score - a.score);
}
function exactConcept(q, sid) {
  const n = norm(q); if (!n) return null;
  const hits = S.concepts.filter(c => norm(c.name) === n || (c.aliases || []).some(a => norm(a) === n));
  return hits.find(c => subjectOfConcept(c) === sid) || hits[0] || null;
}
function matchSubject(text) {
  const n = norm(text); if (!n) return null;
  for (const s of SUBJECTS) if ([s.name, s.short, ...s.aliases].some(a => norm(a) === n)) return s.id;
  for (const s of SUBJECTS) if ([s.name, ...s.aliases].some(a => { const x = norm(a); return x.length >= 2 && n.length >= 2 && (n.includes(x) || x.includes(n)); })) return s.id;
  return null;
}
function matchChapter(sid, name) {
  let best = null, bs = 0;
  for (const ch of chaptersOf(sid)) { const s = sim(name, ch.name); if (s > bs) { bs = s; best = ch; } }
  return bs >= 0.5 ? best : null;
}
const tokens = q => q.split(/\s+/).map(norm).filter(Boolean);
function conceptHay(c) { const { s, ch } = conceptPath(c); return norm([c.name, ...(c.aliases || []), ch.name, s.name, s.short].join(' ')); }
function problemHay(p) {
  return norm([p.text, p.source, ...p.attempts.map(a => (a.reason || '') + ' ' + (a.errorTypes || []).join(' ')),
    ...p.conceptIds.map(id => CO[id] ? CO[id].name + ' ' + (CO[id].aliases || []).join(' ') : '')].join(' '));
}
function searchConcepts(q) {
  const tk = tokens(q); if (!tk.length) return [];
  const sub = S.concepts.filter(c => { const h = conceptHay(c); return tk.every(t => h.includes(t)); });
  const fz = rankConcepts(q).map(x => x.c).filter(c => !sub.includes(c));
  return { sub, fz };
}

/* ---------- parse GPT reply ---------- */
function parseReply(text) {
  const t = String(text || '').replace(/\r/g, '').replace(/```[^\n]*\n?/g, '');
  const re = /=+\s*(題目|考點|出處|結束)\s*=+/g;
  const marks = []; let m;
  while ((m = re.exec(t))) marks.push({ k: m[1], start: m.index, end: re.lastIndex });
  if (!marks.some(x => x.k === '考點')) return null;
  const sec = {};
  marks.forEach((mk, i) => { const next = marks[i + 1]; if (!(mk.k in sec)) sec[mk.k] = t.slice(mk.end, next ? next.start : t.length).trim(); });
  const concepts = [];
  (sec['考點'] || '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
    const parts = l.replace(/^([-*•]|\d+[.、)])\s*/, '').split(/[｜|]/).map(x => x.trim()).filter(Boolean);
    if (!parts.length) return;
    let kind = null;
    if (/^(既有|新增|新)$/.test(parts[0])) kind = parts.shift().startsWith('既') ? 'existing' : 'new';
    let subject = '', chapter = '', name = '';
    if (parts.length >= 3) { subject = parts[0]; chapter = parts[1]; name = parts.slice(2).join(' '); }
    else if (parts.length === 2) { subject = parts[0]; name = parts[1]; }
    else name = parts[0];
    name = name.replace(/^[「『"]|[」』"]$/g, '').trim();
    if (name) concepts.push({ kind, subject, chapter, name });
  });
  let source = (sec['出處'] || '').split('\n')[0].trim();
  if (/^[（(].*[)）]$/.test(source) || /^(無|留空|不明|未知|看不出來|-|—|n\/?a)$/i.test(source)) source = '';
  let qtext = sec['題目'] || '';
  if (/^[（(]題目文字[)）]$/.test(qtext)) qtext = '';
  return { text: qtext, source, concepts };
}

/* ---------- classification cards (add flow) ---------- */
function makeCard({ name, subject, chapter }, from) {
  const sid = matchSubject(subject || '');
  const ranked = rankConcepts(name, sid);
  const exact = exactConcept(name, sid);
  const card = { key: uid(), from, input: name, confirmed: false, candidates: ranked.slice(0, 4).map(x => x.c.id) };
  if (exact) { card.mode = 'existing'; card.conceptId = exact.id; }
  else if (ranked[0] && ranked[0].score >= 0.72) { card.mode = 'existing'; card.conceptId = ranked[0].c.id; }
  else {
    card.mode = 'new'; card.newName = name;
    card.newSid = sid || (ranked[0] ? subjectOfConcept(ranked[0].c) : '') || '';
    const ch = card.newSid && chapter ? matchChapter(card.newSid, chapter) : null;
    card.newChapterId = ch ? ch.id : (card.newSid && !chapter && ranked[0] && subjectOfConcept(ranked[0].c) === card.newSid ? ranked[0].c.chapterId : '');
    card.newChapterName = (!ch && chapter && card.newSid) ? chapter : '';
  }
  return card;
}
function cardReadyNew(card) { return card.newName && card.newName.trim() && card.newSid && (card.newChapterId || card.newChapterName); }

async function createChapter(sid, name) {
  const existing = chaptersOf(sid).find(ch => norm(ch.name) === norm(name));
  if (existing) return existing.id;
  const ch = { id: uid(), subject: sid, name: name.trim(), order: Math.max(-1, ...chaptersOf(sid).map(c => c.order)) + 1 };
  S.chapters.push(ch); await dbPut('chapters', ch); reindex();
  return ch.id;
}
async function createConcept({ name, sid, chapterId, chapterName, alias }) {
  const dup = S.concepts.find(c => subjectOfConcept(c) === sid && norm(c.name) === norm(name));
  if (dup) return dup.id;
  const chId = chapterId || await createChapter(sid, chapterName);
  const c = { id: uid(), chapterId: chId, name: name.trim(), aliases: [], summary: '', createdAt: now(), lastReviewedAt: null };
  if (alias && norm(alias) !== norm(c.name)) c.aliases.push(alias.trim());
  S.concepts.push(c); await dbPut('concepts', c); reindex();
  return c.id;
}
async function addAlias(c, alias) {
  if (!alias || norm(alias) === norm(c.name) || (c.aliases || []).some(a => norm(a) === norm(alias))) return;
  c.aliases = [...(c.aliases || []), alias.trim()];
  await dbPut('concepts', c);
}
async function resolvePick(r, alias) {
  if (r.type === 'existing') { await addAlias(CO[r.id], alias); return r.id; }
  return createConcept({ name: r.name, sid: r.sid, chapterId: r.chapterId, chapterName: r.chapterName, alias });
}

/* ---------- photos ---------- */
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600; let w = img.naturalWidth, h = img.naturalHeight;
    const r = Math.min(1, max / Math.max(w, h)); w = Math.round(w * r); h = Math.round(h * r);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise(res => cv.toBlob(b => res(b || file), 'image/jpeg', 0.8));
  } catch (e) { return file; }
  finally { URL.revokeObjectURL(url); }
}
const urlCache = new Map();
async function photoURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const rec = await dbGet('photos', id);
  if (!rec) return '';
  const u = URL.createObjectURL(rec.blob); urlCache.set(id, u); return u;
}
function hydratePhotos(root = document) {
  $$('img[data-photo]', root).forEach(async img => { if (img.getAttribute('src')) return; const u = await photoURL(img.dataset.photo); if (u) img.src = u; });
}
const blobURLs = new WeakMap();
function blobURL(b) { if (!blobURLs.has(b)) blobURLs.set(b, URL.createObjectURL(b)); return blobURLs.get(b); }
function openViewer(src) { const v = $('#viewer'); $('img', v).src = src; v.classList.add('open'); document.body.classList.add('noscroll'); }

const sch = s => `<span class="sch" style="--sc:var(--s-${s.id})">${s.short}</span>`;
function conceptRow(c, why) {

function problemRow(p, excludeConcept) {

const TRIVIAL = /^(粗心|不小心|忘了|忘記|忘記了|不會|不懂|不知道|看錯|算錯|沒想到|不熟|不確定|不清楚)[。.!！~～]*$/;
function attemptProblems(st) {
  if (!st.status) return '選擇這題會不會';
  if (st.status === 'ok') return '';
  if (!st.errorTypes.length) return '選一個錯誤類型';
  const r = (st.reason || '').trim();
  if (!r) return st.status === 'wrong' ? '寫下為什麼錯' : '寫下哪裡不確定';
  if (r.length < 6 || TRIVIAL.test(r)) return '錯因寫具體一點：是哪一步、哪個觀念卡住';
  return '';
}

  <label class="label" for="af-reason">${st.status === 'wrong' ? '為什麼錯？寫具體卡在哪一步' : '哪裡不確定？寫具體哪一步沒把握'}</label>
  <textarea id="af-reason" placeholder="${st.status === 'wrong' ? '例如：以為 LR 旋轉是先右旋再左旋，順序搞反了' : '例如：不確定 TLB miss 時，要不要再加一次查 page table 的時間'}">${esc(st.reason)}</textarea>` : ''}`;
}

/* ---------- router ---------- */
const app = $('#app');
let currentRoute = null;
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
window.addEventListener('hashchange', render);
function render() {
  const h = location.hash || '#/';
  const routes = [
    [/^#\/?$/, renderHome], [/^#\/browse$/, renderBrowse], [/^#\/subject\/(\w+)$/, renderSubject],
    [/^#\/concept\/([\w-]+)$/, renderConcept], [/^#\/problem\/([\w-]+)$/, renderProblem],
    [/^#\/problems$/, renderProblems], [/^#\/add$/, renderAdd], [/^#\/review$/, renderReview],
    [/^#\/session$/, renderSession], [/^#\/stats$/, renderStats], [/^#\/more$/, renderMore],
  ];
  for (const [re, fn] of routes) {
    const m = h.match(re);
    if (m) {
      const changed = currentRoute !== h; currentRoute = h;
      fn(...m.slice(1));
      if (changed) window.scrollTo(0, 0);
      updateTabs(h); hydratePhotos(app);
      return;
    }
  }
  location.hash = '#/';
}
function updateTabs(h) {
  const tab = /^#\/(browse|subject|concept|problem|problems)/.test(h) ? 'browse' : /^#\/add/.test(h) ? 'add' : /^#\/(review|session)/.test(h) ? 'review' : /^#\/(more|stats)/.test(h) ? 'more' : 'home';
  $$('#tabs a').forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
}

/* ---------- review ---------- */
function problemScore(p) {
  const w = { wrong: 3, unsure: 2, ok: 0.5 }[statusOf(p)];
  const wrongs = p.attempts.filter(a => a.status === 'wrong').length;
  const days = (now() - lastTouched(p)) / DAY;
  return (w + 0.5 * Math.max(0, wrongs - 1)) * (1 + Math.min(days, 30) / 7);
}
function reviewPool(sid) {
  const fresh = now() - 20 * 3600 * 1000;
  let ps = S.problems.filter(p => lastTouched(p) < fresh);
  if (sid) ps = ps.filter(p => p.conceptIds.some(id => CO[id] && subjectOfConcept(CO[id]) === sid));
  return ps.sort((a, b) => problemScore(b) - problemScore(a));
}
let RV = { sid: '' };
let R = null;
function startSession(ids, label) { R = { ids, i: 0, revealed: false, st: { status: null, errorTypes: [], reason: '' }, tally: { ok: 0, unsure: 0, wrong: 0 }, label }; currentRoute = null; go('#/session'); }
function renderReview() {
  const pool = reviewPool(RV.sid);
  const byC = new Map();
  pool.forEach(p => p.conceptIds.forEach(id => { if (!CO[id]) return; if (RV.sid && subjectOfConcept(CO[id]) !== RV.sid) return; const e = byC.get(id) || { score: 0, ps: [] }; e.score += problemScore(p); e.ps.push(p); byC.set(id, e); }));
  const top = [...byC.entries()].sort((a, b) => b[1].score - a[1].score).slice(0, 12);
  const why = (c, e) => { const w = e.ps.filter(p => statusOf(p) === 'wrong').length, u = e.ps.filter(p => statusOf(p) === 'unsure').length; const last = Math.max(c.lastReviewedAt || 0, ...e.ps.map(lastTouched)); return [w ? `${w} 題不會` : '', u ? `${u} 題不確定` : '', `上次做：${daysAgo(last)}`].filter(Boolean).join('，'); };
  app.innerHTML = `<h1>複習</h1>
  <p class="lede">${pool.length ? `有 ${pool.length} 題可以複習。錯越多、越久沒看的排越前面。` : S.problems.length ? '目前沒有要複習的題目。今天剛記錄或剛複習過的題目，明天才會排進來。' : '還沒有題目可以複習。'}</p>
  <div class="chips">${[['', '全部'], ...SUBJECTS.map(s => [s.id, s.name])].map(([v, l]) => `<button type="button" class="chip ${RV.sid === v ? 'on' : ''}" data-act="rv-sid" data-v="${v}">${l}</button>`).join('')}</div>
  ${pool.length ? `<button type="button" class="btn primary big" data-act="rv-start" data-n="10">開始複習 ${Math.min(10, pool.length)} 題</button>${pool.length > 10 ? `<div class="row"><button type="button" class="btn ghost" data-act="rv-start" data-n="${pool.length}">全部 ${pool.length} 題一起複習</button></div>` : ''}` : ''}
  ${top.length ? `<h2>最該複習的考點</h2><div class="list">${top.map(([id, e]) => conceptRow(CO[id], why(CO[id], e))).join('')}</div>` : ''}`;
}
function renderSession() {
  if (!R) { go('#/review'); return; }
  if (R.i >= R.ids.length) {
    const t = R.tally;
    app.innerHTML = `<h1>這輪複習完了</h1><div class="tally"><div><b>${t.ok}</b>會</div><div><b>${t.unsure}</b>不確定</div><div><b>${t.wrong}</b>不會</div></div>
    <p class="lede">${t.wrong + t.unsure ? '還不會的題目會繼續排在前面，明天再見。' : '全部都會了，很好。'}</p>

  const summaries = p.conceptIds.map(id => CO[id]).filter(c => c && c.summary);
  app.innerHTML = `<div class="sess-top"><span>${esc(R.label)}</span><span>${R.i + 1} / ${R.ids.length}</span></div><div class="progress"><i style="width:${R.i / R.ids.length * 100}%"></i></div>
  ${conceptPills(p)}
  ${p.photoIds.length ? `<div class="photos">${p.photoIds.map(pid => `<img data-photo="${pid}" data-act="view-photo" alt="題目照片">`).join('')}</div>` : ''}

  ${!R.revealed ? `<p class="muted center" style="margin-top:16px">先在腦中或紙上把這題解一遍，想好再翻開。</p><button type="button" class="btn primary big" data-act="sess-reveal">翻開之前的紀錄</button>`
    : `<section class="reveal"><h2>之前的紀錄</h2><ol class="attempts">${[...p.attempts].reverse().map(attemptHTML).join('')}</ol>

      <h2>這次呢？</h2><div id="sess-form"></div><p class="missing" id="sess-miss"></p><button type="button" class="btn primary big" id="sess-next" data-act="sess-next">記錄，下一題</button></section>`}
  <div class="row"><button type="button" class="btn ghost" data-act="sess-skip">跳過這題</button><button type="button" class="btn ghost" data-act="sess-end">結束複習</button></div>`;
  if (R.revealed) mountAF($('#sess-form'), R.st, () => { const e = attemptProblems(R.st); $('#sess-miss').textContent = e && R.st.status ? e : ''; $('#sess-next').disabled = !!e; });
}
async function recordAttempt(p, st, via) {
  const ok = st.status === 'ok', t = now();
  p.attempts.push({ at: t, status: st.status, errorTypes: ok ? [] : [...st.errorTypes], reason: ok ? '' : st.reason.trim(), via });
  await dbPut('problems', p);
  for (const id of p.conceptIds) { const c = CO[id]; if (c) { c.lastReviewedAt = t; await dbPut('concepts', c); } }
}

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

async function readZip(file) {

    const nlen = cd.getUint16(o + 28, true), xlen = cd.getUint16(o + 30, true), clen = cd.getUint16(o + 32, true), lho = cd.getUint32(o + 42, true);

    map.set(name, async () => {
      const lh = new DataView(await file.slice(lho, lho + 30).arrayBuffer());
      const start = lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      const raw = file.slice(start, start + csize);

function buildOverviewMD() {
  const L = [`# 考點筆記總覽`, ``, `匯出時間：${new Date().toLocaleString('zh-TW')}　共 ${S.problems.length} 題、${S.concepts.length} 個考點`, ``];
  for (const s of SUBJECTS) {
    const chs = chaptersOf(s.id).filter(ch => conceptsOfChapter(ch.id).length); if (!chs.length) continue;
    L.push(`## ${s.name}`, '');
    for (const ch of chs) {
      L.push(`### ${ch.name}`, '');
      for (const c of conceptsOfChapter(ch.id)) {
        L.push(`#### ${c.name}`);
        if ((c.aliases || []).length) L.push(`別名：${c.aliases.join('、')}`);
        if (c.summary) L.push('', '重點摘要：', c.summary);
        L.push('');
        for (const p of problemsOf(c.id)) {
          L.push(`- 題目 ${p.id.slice(0, 8)}${p.source ? `（${p.source}）` : ''}，目前狀態：${STATUS[statusOf(p)].label}${p.photoIds.length ? `，照片：${p.photoIds.map(x => `photos/${x}.jpg`).join('、')}` : ''}`);
          if (p.text) L.push(`  - 題目文字：${p.text.replace(/\n/g, ' ')}`);
          p.attempts.forEach(a => L.push(`  - ${fmtFull(a.at)} ${STATUS[a.status].label}${(a.errorTypes || []).length ? `［${a.errorTypes.join('、')}］` : ''}${a.reason ? `：${a.reason.replace(/\n/g, ' ')}` : ''}`));
        }

      }

}
async function prepareBackup(btn) {

    const data = JSON.parse(await (await zip.get('data.json')()).text());
    if (data.app !== 'kaodian-notebook' || !Array.isArray(data.problems)) throw new Error('這不是考點筆記的備份檔。');
    if (!confirm(`這份備份有 ${data.problems.length} 題、${data.concepts.length} 個考點（${String(data.exportedAt).slice(0, 10)}）。\n還原會取代目前手機上的 ${S.problems.length} 題，確定要還原嗎？`)) return;
    toast('正在還原…');
    const photos = []; let missing = 0;
    for (const p of data.problems) for (const pid of p.photoIds || []) {
      const g = zip.get(`photos/${pid}.jpg`);
      if (g) photos.push({ id: pid, blob: new Blob([await g()], { type: 'image/jpeg' }) }); else missing++;
    }
    await dbClearAll();
    await dbPutMany('chapters', data.chapters); await dbPutMany('concepts', data.concepts); await dbPutMany('problems', data.problems);
    if (photos.length) await dbPutMany('photos', photos);
    await dbPut('meta', { key: 'seeded', value: true });

    await loadAll(); A = newDraft(); BK = null;

    alert(`已還原 ${data.problems.length} 題。${missing ? `\n有 ${missing} 張照片在備份檔裡找不到。` : ''}`);

    openSheet(`<h2>編輯題目</h2><span class="label">照片</span><div id="pe-photos"></div><label class="label" for="pe-text">題目文字</label><textarea id="pe-text">${esc(p.text)}</textarea><label class="label" for="pe-src">出處</label><input id="pe-src" value="${esc(p.source)}"><button type="button" class="btn primary big" id="pe-save">儲存變更</button>`, () => {
      const draw = () => {
        $('#pe-photos').innerHTML = `<div class="photo-grid">${keep.map((id, i) => `<div class="pg-item"><img data-photo="${id}" alt=""><button type="button" class="pg-x" data-pe-del="k${i}" aria-label="移除">×</button></div>`).join('')}${added.map((b, i) => `<div class="pg-item"><img src="${blobURL(b)}" alt=""><button type="button" class="pg-x" data-pe-del="a${i}" aria-label="移除">×</button></div>`).join('')}<label class="pg-add"><input type="file" accept="image/*" multiple id="pe-file"><span>加照片</span></label></div>`;
        hydratePhotos($('#pe-photos'));
        $('#pe-file').onchange = async e => { for (const f of e.target.files) added.push(await compressImage(f)); draw(); };
        $$('[data-pe-del]').forEach(b => b.onclick = () => { const v = b.dataset.peDel; if (v[0] === 'k') keep.splice(+v.slice(1), 1); else added.splice(+v.slice(1), 1); draw(); });
      };
      draw();
      $('#pe-save').onclick = async () => {
        const text = $('#pe-text').value.trim();
        if (!keep.length && !added.length && !text) { toast('至少要有一張照片或題目文字'); return; }
        for (const id of p.photoIds) if (!keep.includes(id)) await dbDel('photos', id);
        const newIds = []; for (const b of added) { const id = uid(); await dbPut('photos', { id, blob: b }); newIds.push(id); }
        p.photoIds = [...keep, ...newIds]; p.text = text; p.source = $('#pe-src').value.trim();
        await dbPut('problems', p); closeSheet(); render(); toast('已儲存');
      };
    });
  },
  'problem-concepts': (d) => {
    const p = PR[d.id];
    const open = () => openSheet(`<h2>這題的考點</h2><div class="list">${p.conceptIds.map(id => CO[id]).filter(Boolean).map(c => { const { s, ch } = conceptPath(c); return `<div class="crow" style="--sc:var(--s-${s.id})"><span class="crow-main"><span class="crow-name">${esc(c.name)}</span><span class="crow-path">${s.short} › ${esc(ch.name)}</span></span>${p.conceptIds.length > 1 ? `<button type="button" class="btn ghost small danger" data-pc-del="${c.id}">移除</button>` : ''}</div>`; }).join('')}</div><button type="button" class="btn big" id="pc-add">加入考點</button>`, body => {
      body.addEventListener('click', async e => { const b = e.target.closest('[data-pc-del]'); if (!b) return; p.conceptIds = p.conceptIds.filter(x => x !== b.dataset.pcDel); await dbPut('problems', p); open(); render(); });
      $('#pc-add').onclick = () => openPicker({ title: '加入哪個考點？', onPick: async r => { const id = await resolvePick(r); if (!p.conceptIds.includes(id)) p.conceptIds.push(id); await dbPut('problems', p); render(); open(); } });
    });
    open();
  },
  'problem-delete': async (d) => {
    const p = PR[d.id]; if (!confirm('刪除這題和它的照片、作答紀錄？')) return;
    for (const id of p.photoIds) await dbDel('photos', id);
    S.problems = S.problems.filter(x => x.id !== p.id); await dbDel('problems', p.id); reindex();
    toast('已刪除'); if (history.length > 1) history.back(); else go('#/');
  },

  'rv-sid': (d) => { RV.sid = d.v; render(); },
  'rv-start': (d) => { const pool = reviewPool(RV.sid).slice(0, +d.n); const l = RV.sid ? SUBJ[RV.sid].name : '全部科目'; startSession(pool.map(p => p.id), l); },
  'sess-reveal': () => { R.revealed = true; renderSession(); hydratePhotos(app); },
  'sess-next': async () => {
    if (attemptProblems(R.st)) return;
    const p = PR[R.ids[R.i]]; await recordAttempt(p, R.st, 'review');
    R.tally[R.st.status]++; R.i++; R.revealed = false; R.st = { status: null, errorTypes: [], reason: '' };
    renderSession(); hydratePhotos(app); window.scrollTo(0, 0);
  },
  'sess-skip': () => { R.i++; R.revealed = false; R.st = { status: null, errorTypes: [], reason: '' }; renderSession(); hydratePhotos(app); window.scrollTo(0, 0); },
  'sess-end': () => { R.i = R.ids.length; renderSession(); },

  'backup-prepare': (d, el) => prepareBackup(el),
  'backup-share': () => shareBackup(),
  'wipe': async () => {
    const v = prompt('這會刪除所有筆記和照片，而且無法復原。\n確定的話，請輸入「清除」兩個字。');
    if (v !== '清除') return;
    await dbClearAll(); urlCache.clear(); await loadAll(); A = newDraft(); toast('已清除所有資料'); go('#/');
  },
};

document.addEventListener('click', async e => {
  const a = e.target.closest('a[href^="#"]');
  if (a && !a.dataset.act && a.getAttribute('href') === (location.hash || '#/')) { e.preventDefault(); currentRoute = null; render(); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault();
  try { await fn(el.dataset, el, e); } catch (err) { console.error(err); alert('發生錯誤：' + (err && err.message || err)); }
});
document.addEventListener('focusin', e => { if (e.target.matches('input:not([type=file]),textarea,select')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('input:not([type=file]),textarea,select')) document.body.classList.remove('typing'); }, 50));

async function init() {
  try {
    db = await openDB();
    await loadAll();
    A = sanitizeDraft(S.meta.draft);
  } catch (e) {
    app.innerHTML = `<h1>無法開啟筆記資料庫</h1><p>${esc(e && e.message || e)}</p><p class="muted">如果正在使用 Safari 的無痕瀏覽，請改用一般模式，或從主畫面的圖示開啟。</p>`;
    return;
  }
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (isStandalone() && S.problems.length) requestPersist();
}
init();
</script>
</body>
</html>
